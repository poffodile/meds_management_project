name: Record7 verification

on:
  push:
    branches:
      - record7-section0-access
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record7-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: record7-ci-root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -precord7-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: root
      DB_PASSWORD: record7-ci-root
      RECORD7_DB_HOST: 127.0.0.1
      RECORD7_DB_PORT: 3306
      RECORD7_DB_DATABASE: record7_test
      RECORD7_DB_USERNAME: root
      RECORD7_DB_PASSWORD: record7-ci-root
      RECORD7_ALLOW_FIXTURE_SEED: "true"

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Create disposable test databases
        run: |
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "record7-ci-root"); $pdo->exec("CREATE DATABASE IF NOT EXISTS laravel_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"); $pdo->exec("CREATE DATABASE IF NOT EXISTS record7_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'

      - name: Migrate isolated Record7 database
        run: php artisan migrate:fresh --database=record7 --path=database/migrations/record7 --force

      - name: Anchor fictional medication fixture
        run: echo "RECORD7_FIXTURE_CLOCK=$(date -u +'%Y-%m-%dT14:00:00+00:00')" >> "$GITHUB_ENV"

      - name: Seed fictional Record7 fixtures
        run: |
          php artisan db:seed --class=Record7Section0Seeder --force
          php artisan db:seed --class=Record7Section1Seeder --force
          php artisan db:seed --class=Record7Section12Seeder --force

      - name: Run Record7 feature tests
        run: php artisan test tests/Feature/Record7

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve frontend dependency graph for diagnostic build
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify committed lockfile is reproducible
        run: git diff --exit-code -- package-lock.json
